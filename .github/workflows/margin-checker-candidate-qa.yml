name: Margin Checker static candidate QA

on:
  pull_request:
    paths:
      - 'app-store/margin-checker/v1-candidate/**'
      - '.github/workflows/margin-checker-candidate-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source candidate
        run: node --test app-store/margin-checker/v1-candidate/tests/check-source.mjs

  simulator-build:
    name: iOS simulator compile (unsigned)
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app-store/margin-checker/v1-candidate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify Xcode environment
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
          xcode_version="$(xcodebuild -version | awk '/^Xcode / {print $2}')"
          major="${xcode_version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "Xcode 26 or later required; found $xcode_version" >&2
            exit 1
          fi
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Test reviewed web source
        run: npm test
      - name: Generate native iOS project
        run: npx cap add ios
      - name: Install approved Margin Checker app icon
        run: |
          test -f assets/AppIcon-1024.png
          cp assets/AppIcon-1024.png ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
          sips -g pixelWidth -g pixelHeight ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png
      - name: Verify unsigned iOS simulator build
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Upload unsigned simulator project for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: margin-checker-ios-unsigned-project
          path: |
            app-store/margin-checker/v1-candidate/ios/App/App.xcodeproj
            app-store/margin-checker/v1-candidate/ios/App/App.xcworkspace
            app-store/margin-checker/v1-candidate/ios/App/App/Assets.xcassets
          if-no-files-found: ignore
          retention-days: 3
